name: auto-merge
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const n = context.issue.number;
            const files = await github.rest.pulls.listFiles({owner, repo, pull_number: n});
            if (files.data.every(f => f.filename === 'prompts.md'))
              await github.rest.pulls.merge({owner, repo, pull_number: n, merge_method: 'squash'});
